name: plugin-release

# The one release workflow every Dusk plugin calls. Copied CI drifts silently,
# and a marketplace whose plugins each package themselves slightly differently
# is one where installing is different every time.
on:
  workflow_call:
    inputs:
      scope:
        description: What to cut
        type: string
        default: Release
      bump:
        description: Which part of the version to bump
        type: string
        default: patch
      go-version-file:
        type: string
        default: go.mod

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Quill counts versions off the tag list and refuses a shallow
          # checkout rather than restarting the version line at the beginning.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}

      # Ahead of quill, so a plugin that does not pass its own tests never
      # reaches the step that cuts a tag.
      - name: Test
        run: go test -race ./...

      # A plugin ships binaries Dusk downloads, so GoReleaser is the publisher.
      # No major alias: it exists so `uses: thing@v1` keeps working, and Dusk
      # installs an exact version off `releases/latest` instead.
      - uses: TheOutdoorProgrammer/quill@v1
        with:
          bump: ${{ inputs.bump }}
          scope: ${{ inputs.scope }}
          publish: goreleaser
          major-alias: "false"
